name: Provision DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      spaces_name:
        description: 'DigitalOcean Spaces bucket name'
        required: true
        type: string
        default: 'ayurvahi-config'
      spaces_region:
        description: 'DigitalOcean Spaces region'
        required: true
        type: string
        default: 'blr1'

jobs:
  provision:
    runs-on: ubuntu-latest
    
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
      DO_SPACES_NAME: ${{ inputs.spaces_name }}
      DO_SPACES_REGION: ${{ inputs.spaces_region }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Debug: Show current directory and permissions
        pwd
        ls -la
        
        # Make script executable
        chmod +x fetch-env.sh
        
        # Install s3cmd if needed
        if ! command -v s3cmd &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y s3cmd
        fi
        
        # Fetch and source deployment config
        sudo -E ./fetch-env.sh
        source deployment.env
        
        # Check if droplet already exists
        echo "Checking for existing droplet..."
        EXISTING_DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | grep "my-droplet" | awk '{print $1}')
        
        if [ ! -z "$EXISTING_DROPLET_ID" ]; then
          echo "Found existing droplet with ID: $EXISTING_DROPLET_ID"
          
          # Check if IP is already assigned
          CURRENT_IP=$(doctl compute droplet get $EXISTING_DROPLET_ID --format PublicIPv4 --no-header)
          if [ "$CURRENT_IP" == "$RESERVED_IP" ]; then
            echo "Reserved IP is already assigned to the droplet"
            DROPLET_ID=$EXISTING_DROPLET_ID
          else
            echo "Destroying existing droplet..."
            doctl compute droplet delete $EXISTING_DROPLET_ID --force
            
            echo "Creating new droplet..."
            DROPLET_ID=$(doctl compute droplet create my-droplet \
              --region blr1 \
              --image docker-20-04 \
              --size s-2vcpu-4gb \
              --ssh-keys ${SSH_KEY_ID} \
              --enable-monitoring \
              --format ID \
              --no-header)
          fi
        else
          # Verify SSH key
          echo "Checking SSH key..."
          SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
          echo "SSH key verification completed"
          
          # Create new droplet
          echo "Creating new droplet..."
          DROPLET_ID=$(doctl compute droplet create my-droplet \
            --region blr1 \
            --image docker-20-04 \
            --size s-2vcpu-4gb \
            --ssh-keys ${SSH_KEY_ID} \
            --enable-monitoring \
            --format ID \
            --no-header)
        fi
        
        echo "Droplet ID: $DROPLET_ID"
        
        # Wait for droplet to be active
        echo "Waiting for droplet to become active..."
        while [[ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]]; do
          echo "Still waiting..."
          sleep 10
        done
        
        # Check current IP assignment
        echo "Checking current IP assignment..."
        CURRENT_IP=$(doctl compute floating-ip get $RESERVED_IP --format Droplet --no-header)
        
        if [ "$CURRENT_IP" != "$DROPLET_ID" ]; then
          echo "Assigning reserved IP..."
          doctl compute floating-ip-action assign $RESERVED_IP $DROPLET_ID
        else
          echo "Reserved IP is already assigned to the correct droplet"
        fi
        
        # Set the IP in environment
        echo "DROPLET_IP=$RESERVED_IP" >> $GITHUB_ENV
        
        echo "Droplet setup completed"

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${{ env.DROPLET_IP }}:~/app

    - name: Configure Environment and Start Services
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Create .env file for Docker Compose
        cat > .env << EOL
        DO_SPACES_KEY=${{ secrets.DO_SPACES_KEY }}
        DO_SPACES_SECRET=${{ secrets.DO_SPACES_SECRET }}
        DO_SPACES_NAME=${{ inputs.spaces_name }}
        DO_SPACES_REGION=${{ inputs.spaces_region }}
        ENVIRONMENT=${{ inputs.environment }}
        EOL
        
        # Make scripts executable and fetch environment files
        chmod +x fetch-env.sh
        
        # Login to GitHub Container Registry
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Start services with environment variables
        docker compose --env-file .env up -d
        
        echo "Application started with ${{ inputs.environment }} environment"
        EOF

    - name: Initialize Database
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        source deployment.env
        
        # Run migrations
        docker compose run --rm api python3 manage.py migrate
        
        # Populate database if configured
        if [[ "\$POPULATE_DB" == "true" ]]; then
          docker compose run --rm api python3 manage.py populatedb
          echo "Database populated with sample data"
        fi
        
        # Create superuser if configured
        if [[ "\$CREATE_SUPERUSER" == "true" ]]; then
          docker compose run --rm -e DJANGO_SUPERUSER_PASSWORD="\$SUPERUSER_PASSWORD" \
            -e DJANGO_SUPERUSER_EMAIL="\$SUPERUSER_EMAIL" \
            api python3 manage.py createsuperuser --noinput
          echo "Superuser created successfully"
        fi
        EOF

    - name: Verify Deployment
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        source deployment.env
        
        echo "Current environment: \$(cat .env_current)"
        echo "Domain: \$DOMAIN"
        echo "Container status:"
        docker compose ps
        
        echo "Container logs:"
        docker compose logs --tail=20
        EOF

    - name: Configure Firewall
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        # Allow HTTP and HTTPS traffic
        ufw allow 80/tcp
        ufw allow 443/tcp
        ufw allow 8000/tcp
        ufw allow 9000/tcp
        ufw allow 3000/tcp
        ufw --force enable
        
        # Verify firewall rules
        ufw status
        EOF

    - name: Configure SSL
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        source deployment.env
        
        # Stop services for SSL setup
        systemctl stop nginx || true
        docker compose down
        
        # Install certbot if needed
        if ! command -v certbot &> /dev/null; then
          apt-get update
          apt-get remove -y nginx nginx-common || true
          apt-get install -y certbot
        fi
        
        # Set up SSL certificates
        certbot certonly --standalone \
          --preferred-challenges http \
          -d \$DOMAIN \
          --non-interactive \
          --agree-tos \
          -m admin@ayurvahi.com \
          --server https://api.buypass.com/acme/directory \
          --cert-name \$DOMAIN
        
        # Start services again
        docker compose up -d
        EOF
