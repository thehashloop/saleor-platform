name: Provision DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      populate_db:
        description: 'Populate database with sample data'
        required: true
        type: boolean
        default: false
      create_superuser:
        description: 'Create a superuser account'
        required: true
        type: boolean
        default: false
      superuser_email:
        description: 'Superuser email address'
        required: false
        type: string
      superuser_password:
        description: 'Superuser password'
        required: false
        type: string
      reserved_ip:
        description: 'Reserved IP address to assign to the droplet'
        required: true
        type: string
      domain:
        description: 'Domain name to use (e.g. test.ayurvahi.com)'
        required: true
        type: string
      spaces_name:
        description: 'DigitalOcean Spaces bucket name'
        required: true
        type: string
        default: 'ayurvahi-certs'
      spaces_region:
        description: 'DigitalOcean Spaces region'
        required: true
        type: string
        default: 'blr1'

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Verify SSH key and get its ID
        echo "Checking SSH key..."
        SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
        echo "Found SSH key ID: ${SSH_KEY_ID}"
        
        # Create droplet and get its ID
        echo "Creating droplet..."
        DROPLET_ID=$(doctl compute droplet create my-droplet \
          --region blr1 \
          --image docker-20-04 \
          --size s-2vcpu-4gb \
          --ssh-keys ${SSH_KEY_ID} \
          --enable-monitoring \
          --output json | jq -r '.[0].id')
        
        echo "Droplet created with ID: ${DROPLET_ID}"
        
        # Wait for droplet to be active
        echo "Waiting for droplet to become active..."
        while [[ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]]; do
          echo "Waiting for droplet to become active..."
          sleep 10
        done
        
        # Assign the reserved IP to the droplet
        echo "Assigning reserved IP to droplet..."
        doctl compute floating-ip-action assign ${{ inputs.reserved_ip }} $DROPLET_ID
        
        # Set the IP in environment for later use
        echo "DROPLET_IP=${{ inputs.reserved_ip }}" >> $GITHUB_ENV

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${{ env.DROPLET_IP }}:~/app

    - name: Update Configuration Files
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Update docker-compose.yml with domain name
        sed -i "s#DASHBOARD_URL=http://localhost:9000/#DASHBOARD_URL=https://${{ inputs.domain }}/dashboard/#" docker-compose.yml
        sed -i "s/ALLOWED_HOSTS=localhost,api/ALLOWED_HOSTS=localhost,api,${{ inputs.domain }}/" docker-compose.yml
        sed -i "s#API_URL=http://localhost:8000/#API_URL=https://${{ inputs.domain }}/graphql/#" docker-compose.yml
        sed -i "s#NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/#NEXT_PUBLIC_SALEOR_API_URL=https://${{ inputs.domain }}/graphql/#" docker-compose.yml
        sed -i "s#NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000#NEXT_PUBLIC_STOREFRONT_URL=https://${{ inputs.domain }}#" docker-compose.yml
        
        # Update backend.env with domain name
        sed -i "s#PUBLIC_URL=http://localhost:8000#PUBLIC_URL=https://${{ inputs.domain }}#" backend.env
        sed -i "s#MEDIA_URL=http://localhost:8000/media/#MEDIA_URL=https://${{ inputs.domain }}/media/#" backend.env
        sed -i "s/ALLOWED_CLIENT_HOSTS=localhost/ALLOWED_CLIENT_HOSTS=localhost,${{ inputs.domain }}/" backend.env
        
        # Set DOMAIN environment variable for nginx template
        echo "DOMAIN=${{ inputs.domain }}" > .env
        
        # Verify the changes
        echo "Checking updated configuration..."
        grep "DASHBOARD_URL" docker-compose.yml
        grep "ALLOWED_HOSTS" docker-compose.yml
        grep "API_URL" docker-compose.yml
        grep "NEXT_PUBLIC_SALEOR_API_URL" docker-compose.yml
        grep "NEXT_PUBLIC_STOREFRONT_URL" docker-compose.yml
        grep "PUBLIC_URL" backend.env
        grep "MEDIA_URL" backend.env
        grep "ALLOWED_CLIENT_HOSTS" backend.env
        EOF

    - name: Install Docker and Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
        # Check if Docker is installed and running
        if ! command -v docker &> /dev/null || ! systemctl is-active --quiet docker; then
          apt-get update
          apt-get install -y docker.io docker-compose
          systemctl start docker
          systemctl enable docker
        else
          echo "Docker is already installed and running"
        fi
        
        # Add user to docker group regardless
        usermod -aG docker $USER
        EOF

    - name: Initialize Application
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Build the application
        docker compose build
        
        # Run migrations
        docker compose run --rm api python3 manage.py migrate
        EOF

    - name: Populate Database
      if: ${{ inputs.populate_db }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Populate database with sample data
        docker compose run --rm api python3 manage.py populatedb
        
        echo "Database populated with sample data"
        EOF

    - name: Create Superuser
      if: ${{ inputs.create_superuser }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Create superuser using environment variables
        docker compose run --rm -e DJANGO_SUPERUSER_PASSWORD="${{ inputs.superuser_password }}" \
          -e DJANGO_SUPERUSER_EMAIL="${{ inputs.superuser_email }}" \
          api python3 manage.py createsuperuser --noinput
        
        echo "Superuser created successfully"
        EOF

    - name: Start Services
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Login to GitHub Container Registry
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Stop all services
        docker compose down
        
        # Start services again
        docker compose up -d
        
        # Check logs
        docker compose logs nginx
        EOF

    - name: Output Droplet IP
      run: echo "Droplet IP is ${{ env.DROPLET_IP }}"

    - name: Configure Firewall
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        # Allow HTTP and HTTPS traffic
        ufw allow 80/tcp
        ufw allow 443/tcp
        ufw allow 8000/tcp
        ufw allow 9000/tcp
        ufw allow 3000/tcp
        ufw --force enable
        
        # Verify firewall rules
        ufw status
        EOF

    - name: Stop Services for SSL Setup
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        echo "Stopping system nginx..."
        systemctl stop nginx || true
        
        echo "Stopping docker containers..."
        docker compose down
        
        echo "Checking for processes using ports 80 and 443..."
        netstat -tulpn | grep -E ':80|:443'
        
        echo "Killing any processes using ports 80 and 443..."
        lsof -ti:80 | xargs -r kill -9
        lsof -ti:443 | xargs -r kill -9
        
        echo "Verifying ports are free..."
        netstat -tulpn | grep -E ':80|:443' || echo "Ports are free"
        EOF

    - name: Install Certbot
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        apt-get update
        apt-get remove -y nginx nginx-common || true
        apt-get install -y certbot
        EOF

    - name: Check Existing Certificates in Spaces
      run: |
        # Create a temporary file to store the certificate status
        echo "VALID_CERT_EXISTS=false" > cert_status.txt
        
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
        cd ~/app
        
        # Install s3cmd for Spaces access
        apt-get update && apt-get install -y s3cmd
        
        # Configure s3cmd for Spaces
        cat > ~/.s3cfg << EOL
        [default]
        access_key = ${{ secrets.DO_SPACES_KEY }}
        secret_key = ${{ secrets.DO_SPACES_SECRET }}
        host_base = ${{ inputs.spaces_region }}.digitaloceanspaces.com
        host_bucket = %(bucket)s.${{ inputs.spaces_region }}.digitaloceanspaces.com
        use_https = True
        EOL
        
        # Create bucket if it doesn't exist
        if ! s3cmd ls s3://${{ inputs.spaces_name }}; then
          echo "Creating bucket ${{ inputs.spaces_name }}"
          s3cmd mb s3://${{ inputs.spaces_name }}
        fi
        
        # Create temp directory for certificates
        mkdir -p .certificates
        
        # Try to download existing certificates using s3cmd
        if s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem .certificates/fullchain.pem 2>/dev/null; then
          s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem .certificates/privkey.pem
          
          # Check if certificates are valid
          if openssl x509 -checkend 2592000 -noout -in .certificates/fullchain.pem; then
            echo "Found valid certificates in Spaces"
            mkdir -p /etc/letsencrypt/live/${{ inputs.domain }}
            cp .certificates/fullchain.pem /etc/letsencrypt/live/${{ inputs.domain }}/
            cp .certificates/privkey.pem /etc/letsencrypt/live/${{ inputs.domain }}/
            echo "true" > /tmp/cert_valid
          else
            echo "Certificates exist but are expired"
            echo "false" > /tmp/cert_valid
          fi
        else
          echo "No existing certificates found in Spaces"
          echo "false" > /tmp/cert_valid
        fi
        EOF
        
        # Get the certificate status from the remote machine
        scp -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }}:/tmp/cert_valid cert_valid || echo "false" > cert_valid
        
        # Set the environment variable in GitHub Actions
        if [ "$(cat cert_valid)" == "true" ]; then
          echo "VALID_CERT_EXISTS=true" >> $GITHUB_ENV
        else
          echo "VALID_CERT_EXISTS=false" >> $GITHUB_ENV
        fi

    - name: Try ZeroSSL if Let's Encrypt Fails
      if: ${{ env.VALID_CERT_EXISTS != 'true' }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Install pip3 and certbot plugin
        apt-get update
        apt-get install -y python3-pip
        pip3 install certbot-dns-digitalocean
        
        # Stop any services using port 80
        systemctl stop nginx || true
        docker compose down || true
        
        # Try ZeroSSL with HTTP challenge
        certbot certonly --standalone \
          --preferred-challenges http \
          -d ${{ inputs.domain }} \
          --non-interactive \
          --agree-tos \
          -m admin@ayurvahi.com \
          --server https://acme.zerossl.com/v2/DV90 \
          --eab-kid "${{ secrets.ZEROSSL_KID }}" \
          --eab-hmac-key "${{ secrets.ZEROSSL_HMAC_KEY }}"
        
        if [ $? -eq 0 ]; then
          echo "Successfully obtained certificates from ZeroSSL"
          
          # Upload new certificates to Spaces
          s3cmd put /etc/letsencrypt/live/${{ inputs.domain }}/fullchain.pem \
            s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem
          
          s3cmd put /etc/letsencrypt/live/${{ inputs.domain }}/privkey.pem \
            s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem
          
          echo "Certificates uploaded to Spaces"
        else
          echo "Failed to obtain certificates from ZeroSSL"
          exit 1
        fi
        EOF

    - name: Configure SSL for Nginx
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Create SSL directory
        mkdir -p nginx/ssl
        
        # Check if certificate exists and copy if it does
        if [ -d "/etc/letsencrypt/live/${{ inputs.domain }}" ]; then
          cp /etc/letsencrypt/live/${{ inputs.domain }}/fullchain.pem nginx/ssl/
          cp /etc/letsencrypt/live/${{ inputs.domain }}/privkey.pem nginx/ssl/
          
          # Set proper permissions
          chmod 644 nginx/ssl/fullchain.pem
          chmod 644 nginx/ssl/privkey.pem
          
          # Verify files exist and permissions
          ls -l nginx/ssl/
        else
          echo "SSL certificates not found at /etc/letsencrypt/live/${{ inputs.domain }}"
          exit 1
        fi
        EOF

    - name: Configure Nginx
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Export DOMAIN variable
        export DOMAIN=${{ inputs.domain }}
        
        # Create the default.conf from template
        envsubst '\${DOMAIN}' < nginx/conf.d/default.conf.template > nginx/conf.d/default.conf
        
        # Verify the configuration
        echo "Checking nginx configuration:"
        cat nginx/conf.d/default.conf
        
        # Verify DOMAIN variable
        echo "DOMAIN variable value: \$DOMAIN"
        EOF

    - name: Start Services with SSL
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        docker compose up -d
        EOF

    - name: Debug Service Status
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Check container status
        docker compose ps
        
        # Check nginx logs
        docker compose logs nginx
        
        # Check if ports are actually bound
        netstat -tulpn | grep -E '::443'
        
        # Check nginx configuration
        docker compose exec nginx nginx -t
        
        # Check SSL certificate permissions
        ls -l nginx/ssl/
        EOF
