name: Provision DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      populate_db:
        description: 'Populate database with sample data'
        required: true
        type: boolean
        default: false
      create_superuser:
        description: 'Create a superuser account'
        required: true
        type: boolean
        default: false
      superuser_email:
        description: 'Superuser email address'
        required: false
        type: string
      superuser_password:
        description: 'Superuser password'
        required: false
        type: string
      reserved_ip:
        description: 'Reserved IP address to assign to the droplet'
        required: true
        type: string
      domain:
        description: 'Domain name to use (e.g. test.ayurvahi.com)'
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Verify SSH key and get its ID
        echo "Checking SSH key..."
        SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
        echo "Found SSH key ID: ${SSH_KEY_ID}"
        
        # Create droplet and get its ID
        echo "Creating droplet..."
        DROPLET_ID=$(doctl compute droplet create my-droplet \
          --region blr1 \
          --image docker-20-04 \
          --size s-2vcpu-4gb \
          --ssh-keys ${SSH_KEY_ID} \
          --enable-monitoring \
          --output json | jq -r '.[0].id')
        
        echo "Droplet created with ID: ${DROPLET_ID}"
        
        # Wait for droplet to be active
        echo "Waiting for droplet to become active..."
        while [[ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]]; do
          echo "Waiting for droplet to become active..."
          sleep 10
        done
        
        # Assign the reserved IP to the droplet
        echo "Assigning reserved IP to droplet..."
        doctl compute floating-ip-action assign ${{ inputs.reserved_ip }} $DROPLET_ID
        
        # Set the IP in environment for later use
        echo "DROPLET_IP=${{ inputs.reserved_ip }}" >> $GITHUB_ENV

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${{ env.DROPLET_IP }}:~/app

    - name: Update Configuration Files
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Update docker-compose.yml with domain name
        sed -i "s#DASHBOARD_URL=http://localhost:9000/#DASHBOARD_URL=https://${{ inputs.domain }}/dashboard/#" docker-compose.yml
        sed -i "s/ALLOWED_HOSTS=localhost,api/ALLOWED_HOSTS=localhost,api,${{ inputs.domain }}/" docker-compose.yml
        sed -i "s#API_URL=http://localhost:8000/#API_URL=https://${{ inputs.domain }}/graphql/#" docker-compose.yml
        sed -i "s#NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/#NEXT_PUBLIC_SALEOR_API_URL=https://${{ inputs.domain }}/graphql/#" docker-compose.yml
        sed -i "s#NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000#NEXT_PUBLIC_STOREFRONT_URL=https://${{ inputs.domain }}#" docker-compose.yml
        
        # Update backend.env with domain name
        sed -i "s#PUBLIC_URL=http://localhost:8000#PUBLIC_URL=https://${{ inputs.domain }}#" backend.env
        sed -i "s#MEDIA_URL=http://localhost:8000/media/#MEDIA_URL=https://${{ inputs.domain }}/media/#" backend.env
        sed -i "s/ALLOWED_CLIENT_HOSTS=localhost/ALLOWED_CLIENT_HOSTS=localhost,${{ inputs.domain }}/" backend.env
        
        # Set DOMAIN environment variable for nginx template
        echo "DOMAIN=${{ inputs.domain }}" > .env
        
        # Verify the changes
        echo "Checking updated configuration..."
        grep "DASHBOARD_URL" docker-compose.yml
        grep "ALLOWED_HOSTS" docker-compose.yml
        grep "API_URL" docker-compose.yml
        grep "NEXT_PUBLIC_SALEOR_API_URL" docker-compose.yml
        grep "NEXT_PUBLIC_STOREFRONT_URL" docker-compose.yml
        grep "PUBLIC_URL" backend.env
        grep "MEDIA_URL" backend.env
        grep "ALLOWED_CLIENT_HOSTS" backend.env
        EOF

    - name: Install Docker and Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
        # Check if Docker is installed and running
        if ! command -v docker &> /dev/null || ! systemctl is-active --quiet docker; then
          apt-get update
          apt-get install -y docker.io docker-compose
          systemctl start docker
          systemctl enable docker
        else
          echo "Docker is already installed and running"
        fi
        
        # Add user to docker group regardless
        usermod -aG docker $USER
        EOF

    - name: Initialize Application
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Build the application
        docker compose build
        
        # Run migrations
        docker compose run --rm api python3 manage.py migrate
        EOF

    - name: Populate Database
      if: ${{ inputs.populate_db }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Populate database with sample data
        docker compose run --rm api python3 manage.py populatedb
        
        echo "Database populated with sample data"
        EOF

    - name: Create Superuser
      if: ${{ inputs.create_superuser }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Create superuser using environment variables
        docker compose run --rm -e DJANGO_SUPERUSER_PASSWORD="${{ inputs.superuser_password }}" \
          -e DJANGO_SUPERUSER_EMAIL="${{ inputs.superuser_email }}" \
          api python3 manage.py createsuperuser --noinput
        
        echo "Superuser created successfully"
        EOF

    - name: Start Services
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Login to GitHub Container Registry
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Start services in detached mode
        docker compose up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to start..."
        sleep 30
        
        # Check container status
        docker compose ps
        EOF

    - name: Output Droplet IP
      run: echo "Droplet IP is ${{ env.DROPLET_IP }}"

    - name: Stop Services for SSL Setup
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        systemctl stop nginx || true
        docker compose down
        # Kill any remaining processes using port 80/443
        lsof -ti:80 | xargs -r kill -9
        lsof -ti:443 | xargs -r kill -9
        EOF

    - name: Install Certbot
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        apt-get update
        apt-get install -y certbot python3-certbot-nginx
        EOF

    - name: Obtain SSL Certificate
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        certbot certonly --standalone -d ${{ inputs.domain }} --non-interactive --agree-tos -m admin@ayurvahi.com
        EOF

    - name: Configure SSL for Nginx
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        mkdir -p nginx/ssl
        cp /etc/letsencrypt/live/${{ inputs.domain }}/fullchain.pem nginx/ssl/
        cp /etc/letsencrypt/live/${{ inputs.domain }}/privkey.pem nginx/ssl/
        systemctl disable nginx
        EOF

    - name: Start Services with SSL
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        docker compose up -d
        EOF
