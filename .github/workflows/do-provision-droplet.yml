name: Provision DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      spaces_name:
        description: 'DigitalOcean Spaces bucket name'
        required: true
        type: string
        default: 'ayurvahi-config'
      spaces_region:
        description: 'DigitalOcean Spaces region'
        required: true
        type: string
        default: 'blr1'

jobs:
  setup-and-provision:
    uses: ./.github/workflows/setup-do-tools.yml
    with:
      environment: ${{ inputs.environment }}
      spaces_name: ${{ inputs.spaces_name }}
      spaces_region: ${{ inputs.spaces_region }}
    secrets:
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}

  debug-output:
    needs: setup-and-provision
    runs-on: ubuntu-latest
    steps:
      - name: Check Droplet IP
        run: |
          echo "Debug: Received droplet IP from setup-and-provision job: ${{ needs.setup-and-provision.outputs.droplet_ip }}"
          if [ -z "${{ needs.setup-and-provision.outputs.droplet_ip }}" ]; then
            echo "Warning: Droplet IP is empty"
            exit 1
          else
            echo "Droplet IP is valid: ${{ needs.setup-and-provision.outputs.droplet_ip }}"
          fi

  deployment:
    needs: [setup-and-provision, debug-output]
    uses: ./.github/workflows/deploy-to-droplet.yml
    with:
      droplet_ip: ${{ needs.setup-and-provision.outputs.droplet_ip }}
      environment: ${{ inputs.environment }}
      spaces_name: ${{ inputs.spaces_name }}
      spaces_region: ${{ inputs.spaces_region }}
    secrets:
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  database:
    needs: [setup-and-provision, deployment]
    uses: ./.github/workflows/initialize-database.yml
    with:
      droplet_ip: ${{ needs.setup-and-provision.outputs.droplet_ip }}
    secrets:
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}

  security:
    needs: [setup-and-provision, database]
    uses: ./.github/workflows/configure-security.yml
    with:
      droplet_ip: ${{ needs.setup-and-provision.outputs.droplet_ip }}
    secrets:
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
