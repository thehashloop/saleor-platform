name: Provision DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      populate_db:
        description: 'Populate database with sample data'
        required: true
        type: boolean
        default: false
      create_superuser:
        description: 'Create a superuser account'
        required: true
        type: boolean
        default: false
      superuser_email:
        description: 'Superuser email address'
        required: false
        type: string
      superuser_password:
        description: 'Superuser password'
        required: false
        type: string
      reserved_ip:
        description: 'Reserved IP address to assign to the droplet'
        required: true
        type: string
      domain:
        description: 'Domain name to use (e.g. test.ayurvahi.com)'
        required: true
        type: string
      spaces_name:
        description: 'DigitalOcean Spaces bucket name'
        required: true
        type: string
        default: 'ayurvahi-config'
      spaces_region:
        description: 'DigitalOcean Spaces region'
        required: true
        type: string
        default: 'blr1'
      db_url:
        description: 'Database URL'
        required: true
        type: string
      

jobs:
  provision:
    runs-on: ubuntu-latest
    
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
      DO_SPACES_NAME: ${{ inputs.spaces_name }}
      DO_SPACES_REGION: ${{ inputs.spaces_region }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Source deployment config
        source .env-files/deployment.env
        
        # Verify SSH key
        echo "Checking SSH key..."
        SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
        echo "SSH key verification completed"
        
        # Create droplet
        echo "Creating droplet..."
        DROPLET_ID=$(doctl compute droplet create my-droplet \
          --region blr1 \
          --image docker-20-04 \
          --size s-2vcpu-4gb \
          --ssh-keys ${SSH_KEY_ID} \
          --enable-monitoring \
          --output json | jq -r '.[0].id')
        
        echo "Droplet creation completed"
        
        # Wait for droplet to be active
        echo "Waiting for droplet to become active..."
        while [[ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]]; do
          echo "Still waiting..."
          sleep 10
        done
        
        # Assign the reserved IP
        echo "Assigning reserved IP..."
        doctl compute floating-ip-action assign $RESERVED_IP $DROPLET_ID
        
        # Set the IP in environment
        echo "DROPLET_IP=$RESERVED_IP" >> $GITHUB_ENV

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${{ env.DROPLET_IP }}:~/app

    - name: Configure Environment and Start Services
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Export environment variables
        export ENVIRONMENT="${{ inputs.environment }}"
        export DO_SPACES_KEY="${{ secrets.DO_SPACES_KEY }}"
        export DO_SPACES_SECRET="${{ secrets.DO_SPACES_SECRET }}"
        export DO_SPACES_NAME="${{ inputs.spaces_name }}"
        export DO_SPACES_REGION="${{ inputs.spaces_region }}"
        
        # Make scripts executable
        chmod +x fetch-env.sh env-manager.sh
        
        # Run environment setup
        ./fetch-env.sh
        
        # Login to GitHub Container Registry
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Start services with the specified environment
        ENVIRONMENT=${{ inputs.environment }} docker compose up -d
        
        echo "Application started with ${{ inputs.environment }} environment"
        EOF

    - name: Initialize Database
      if: inputs.populate_db || inputs.create_superuser
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        source .env-files/deployment.env
        
        # Run migrations
        docker compose run --rm api python3 manage.py migrate
        
        # Populate database if requested
        if [[ "\$POPULATE_DB" == "true" ]]; then
          docker compose run --rm api python3 manage.py populatedb
          echo "Database populated with sample data"
        fi
        
        # Create superuser if requested
        if [[ "\$CREATE_SUPERUSER" == "true" ]]; then
          docker compose run --rm -e DJANGO_SUPERUSER_PASSWORD="\$SUPERUSER_PASSWORD" \
            -e DJANGO_SUPERUSER_EMAIL="\$SUPERUSER_EMAIL" \
            api python3 manage.py createsuperuser --noinput
          echo "Superuser created successfully"
        fi
        EOF

    - name: Verify Deployment
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        echo "Current environment: \$(cat .env_current)"
        echo "Container status:"
        docker compose ps
        
        echo "Container logs:"
        docker compose logs --tail=20
        EOF

    - name: Output Droplet IP
      run: echo "Droplet IP is ${{ env.DROPLET_IP }}"

    - name: Configure Firewall
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        # Allow HTTP and HTTPS traffic
        ufw allow 80/tcp
        ufw allow 443/tcp
        ufw allow 8000/tcp
        ufw allow 9000/tcp
        ufw allow 3000/tcp
        ufw --force enable
        
        # Verify firewall rules
        ufw status
        EOF

    - name: Stop Services for SSL Setup
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        echo "Stopping system nginx..."
        systemctl stop nginx || true
        
        echo "Stopping docker containers..."
        docker compose down
        
        echo "Checking for processes using ports 80 and 443..."
        netstat -tulpn | grep -E ':80|:443'
        
        echo "Killing any processes using ports 80 and 443..."
        lsof -ti:80 | xargs -r kill -9
        lsof -ti:443 | xargs -r kill -9
        
        echo "Verifying ports are free..."
        netstat -tulpn | grep -E ':80|:443' || echo "Ports are free"
        EOF

    - name: Install Certbot
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        apt-get update
        apt-get remove -y nginx nginx-common || true
        apt-get install -y certbot
        EOF

    - name: Check Existing Certificates in Spaces
      run: |
        # Create a temporary file to store the certificate status
        echo "VALID_CERT_EXISTS=false" > cert_status.txt
        
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
        cd ~/app
        
        # Install s3cmd for Spaces access
        apt-get update && apt-get install -y s3cmd
        
        # Configure s3cmd for Spaces
        cat > ~/.s3cfg << EOL
        [default]
        access_key = ${{ secrets.DO_SPACES_KEY }}
        secret_key = ${{ secrets.DO_SPACES_SECRET }}
        host_base = ${{ inputs.spaces_region }}.digitaloceanspaces.com
        host_bucket = %(bucket)s.${{ inputs.spaces_region }}.digitaloceanspaces.com
        use_https = True
        EOL
        
        # Create bucket if it doesn't exist
        if ! s3cmd ls s3://${{ inputs.spaces_name }}; then
          echo "Creating bucket ${{ inputs.spaces_name }}"
          s3cmd mb s3://${{ inputs.spaces_name }}
        fi
        
        # Create temp directory for certificates
        mkdir -p .certificates
        
        # Try to download existing certificates using s3cmd
        if s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem .certificates/fullchain.pem 2>/dev/null; then
          s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem .certificates/privkey.pem
          
          # Check if certificates are valid
          if openssl x509 -checkend 2592000 -noout -in .certificates/fullchain.pem; then
            echo "Found valid certificates in Spaces"
            mkdir -p /etc/letsencrypt/live/${{ inputs.domain }}
            cp .certificates/fullchain.pem /etc/letsencrypt/live/${{ inputs.domain }}/
            cp .certificates/privkey.pem /etc/letsencrypt/live/${{ inputs.domain }}/
            echo "true" > /tmp/cert_valid
          else
            echo "Certificates exist but are expired"
            echo "false" > /tmp/cert_valid
          fi
        else
          echo "No existing certificates found in Spaces"
          echo "false" > /tmp/cert_valid
        fi
        EOF
        
        # Get the certificate status from the remote machine
        scp -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }}:/tmp/cert_valid cert_valid || echo "false" > cert_valid
        
        # Set the environment variable in GitHub Actions
        if [ "$(cat cert_valid)" == "true" ]; then
          echo "VALID_CERT_EXISTS=true" >> $GITHUB_ENV
        else
          echo "VALID_CERT_EXISTS=false" >> $GITHUB_ENV
        fi

    - name: Try OpenCA Certificate Generation
      if: ${{ env.VALID_CERT_EXISTS != 'true' }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Install pip3 and certbot plugin
        apt-get update
        apt-get install -y python3-pip
        pip3 install certbot-dns-digitalocean
        
        # Stop any services using port 80
        systemctl stop nginx || true
        docker compose down || true
        
        # Create required directories
        mkdir -p /etc/letsencrypt/live/${{ inputs.domain }}
        
        # Show debug info before certificate request
        echo "Current directory structure:"
        ls -la /etc/letsencrypt/
        
        # Try OpenCA with HTTP challenge and verbose output
        certbot certonly --standalone \
          --preferred-challenges http \
          -d ${{ inputs.domain }} \
          --non-interactive \
          --agree-tos \
          -m admin@ayurvahi.com \
          --server https://api.buypass.com/acme/directory \
          --cert-name ${{ inputs.domain }} \
          -v
        
        CERT_EXIT_CODE=$?
        echo "Certbot exit code: \$CERT_EXIT_CODE"
        
        # Show debug info after certificate request
        echo "Directory structure after certbot:"
        ls -la /etc/letsencrypt/
        ls -la /etc/letsencrypt/live/ || true
        ls -la /etc/letsencrypt/archive/ || true
        
        if [ \$CERT_EXIT_CODE -eq 0 ]; then
          echo "Successfully obtained certificates from OpenCA"
          
          # Find the actual certificate files
          CERT_DIR=\$(find /etc/letsencrypt/live -type l -name fullchain.pem | head -n 1 | xargs dirname)
          echo "Found certificate directory: \$CERT_DIR"
          
          if [ -n "\$CERT_DIR" ] && [ -L "\$CERT_DIR/fullchain.pem" ] && [ -L "\$CERT_DIR/privkey.pem" ]; then
            # Get the actual files from archive
            REAL_FULLCHAIN=\$(readlink -f "\$CERT_DIR/fullchain.pem")
            REAL_PRIVKEY=\$(readlink -f "\$CERT_DIR/privkey.pem")
            
            echo "Real certificate paths:"
            echo "Fullchain: \$REAL_FULLCHAIN"
            echo "Privkey: \$REAL_PRIVKEY"
            
            # Upload the actual certificate files to Spaces
            s3cmd put "\$REAL_FULLCHAIN" \
              "s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem"
            
            s3cmd put "\$REAL_PRIVKEY" \
              "s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem"
            
            # Copy to the expected location
            cp "\$REAL_FULLCHAIN" "/etc/letsencrypt/live/${{ inputs.domain }}/fullchain.pem"
            cp "\$REAL_PRIVKEY" "/etc/letsencrypt/live/${{ inputs.domain }}/privkey.pem"
            
            echo "Certificates copied and uploaded"
            ls -l "/etc/letsencrypt/live/${{ inputs.domain }}/"
          else
            echo "Could not find certificate symlinks"
            exit 1
          fi
        else
          echo "Failed to obtain certificates from OpenCA"
          cat /var/log/letsencrypt/letsencrypt.log
          exit 1
        fi
        EOF

    - name: Configure SSL for Nginx
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Create SSL directory
        mkdir -p nginx/ssl
        
        # Check if certificate exists and copy if it does
        if [ -d "/etc/letsencrypt/live/${{ inputs.domain }}" ]; then
          cp /etc/letsencrypt/live/${{ inputs.domain }}/fullchain.pem nginx/ssl/
          cp /etc/letsencrypt/live/${{ inputs.domain }}/privkey.pem nginx/ssl/
          
          # Set proper permissions
          chmod 644 nginx/ssl/fullchain.pem
          chmod 644 nginx/ssl/privkey.pem
          
          # Verify files exist and permissions
          ls -l nginx/ssl/
        else
          echo "SSL certificates not found at /etc/letsencrypt/live/${{ inputs.domain }}"
          exit 1
        fi
        EOF

    - name: Configure Nginx
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Export DOMAIN variable
        export DOMAIN=${{ inputs.domain }}
        
        # Create the default.conf from template
        envsubst '\${DOMAIN}' < nginx/conf.d/default.conf.template > nginx/conf.d/default.conf
        
        # Verify the configuration
        echo "Checking nginx configuration:"
        cat nginx/conf.d/default.conf
        
        # Verify DOMAIN variable
        echo "DOMAIN variable value: \$DOMAIN"
        EOF

    - name: Start Services with SSL
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        docker compose up -d
        EOF

    - name: Debug Service Status
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
        cd ~/app
        
        # Install net-tools for netstat
        apt-get update && apt-get install -y net-tools
        
        # Check container status one at a time to avoid memory issues
        echo "Checking container status:"
        docker compose ps
        
        echo "Checking nginx logs:"
        docker compose logs --tail=50 nginx
        
        echo "Checking if ports are bound:"
        netstat -tulpn | grep -E ':443|:80'
        
        echo "Checking nginx configuration:"
        docker compose exec nginx nginx -t || true
        
        echo "Checking SSL certificate permissions:"
        ls -l nginx/ssl/ || echo "SSL directory not found"
        EOF
