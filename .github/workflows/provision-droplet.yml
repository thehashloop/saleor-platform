name: Provision Droplet from Spaces Config

on:
  workflow_dispatch:
    inputs:
      spaces_region:
        description: 'DigitalOcean Spaces region (e.g., nyc3)'
        required: true
        type: string
        default: 'blr1'
      spaces_bucket:
        description: 'DigitalOcean Spaces bucket name'
        required: true
        type: string
        default: 'ayurvahi-config'
      config_path:
        description: 'Path to config file in Spaces (e.g., configs/prod.json)'
        required: true
        type: string
        default: 'env-files/dev/config.json'

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ env.DROPLET_IP }}
      droplet_id: ${{ steps.create_droplet.outputs.droplet_id }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # AWS CLI Setup for Spaces
    - name: Set up AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install
        mkdir -p ~/.aws
        cat > ~/.aws/credentials << EOF
        [default]
        aws_access_key_id = ${{ secrets.DO_SPACES_KEY }}
        aws_secret_access_key = ${{ secrets.DO_SPACES_SECRET }}
        EOF
        cat > ~/.aws/config << EOF
        [default]
        region = ${{ inputs.spaces_region }}
        EOF

    # Configuration Download & Validation
    - name: Download Configuration
      run: |
        aws s3 cp s3://${{ inputs.spaces_bucket }}/${{ inputs.config_path }} config.json \
          --endpoint-url https://${{ inputs.spaces_region }}.digitaloceanspaces.com

    - name: Validate Configuration
      id: load_config
      run: |
        sudo apt-get install jq -y
        extract_config() {
          local value=$(jq -r ".$1" config.json)
          if [ "$value" == "null" ]; then
            echo "::error::Missing required parameter: $1"
            exit 1
          fi
          echo "$value"
        }
        echo "DROPLET_NAME=$(extract_config "droplet_name")" >> $GITHUB_ENV
        echo "REGION=$(extract_config "region")" >> $GITHUB_ENV
        echo "IMAGE=$(extract_config "image")" >> $GITHUB_ENV
        echo "SIZE=$(extract_config "size")" >> $GITHUB_ENV
        echo "SSH_KEY_NAME=$(extract_config "ssh_key_name")" >> $GITHUB_ENV
        echo "ENABLE_MONITORING=$(extract_config "enable_monitoring")" >> $GITHUB_ENV
        echo "RESERVED_IP=$(jq -r '.reserved_ip // empty' config.json)" >> $GITHUB_ENV

    # DigitalOcean Setup
    - name: Install and Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        sudo snap install doctl --classic
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    # SSH Key Validation
    - name: Validate SSH Key
      id: ssh_key_check
      run: |
        SSH_KEY_LIST=$(doctl compute ssh-key list --format Name,ID --no-header)
        SSH_KEY_ID=""
        while IFS= read -r line; do
          KEY_NAME=$(echo "$line" | awk '{$NF=""; print $0}' | sed 's/[[:space:]]*$//')
          KEY_ID=$(echo "$line" | awk '{print $NF}')
          if [ "$KEY_NAME" = "$SSH_KEY_NAME" ]; then
            SSH_KEY_ID="$KEY_ID"
            break
          fi
        done <<< "$SSH_KEY_LIST"
        if [ -z "$SSH_KEY_ID" ] || ! [[ "$SSH_KEY_ID" =~ ^[0-9]+$ ]]; then
          echo "::error::SSH key validation failed"
          exit 1
        fi
        echo "SSH_KEY_ID=$SSH_KEY_ID" >> $GITHUB_ENV

    # Reserved IP Handling
    - name: Prepare Reserved IP
      id: prepare_ip
      run: |
        if [ -z "$RESERVED_IP" ]; then
          RESERVED_IP=$(doctl compute floating-ip create --region $REGION --format IP --no-header)
        else
          ASSIGNMENT=$(doctl compute floating-ip get $RESERVED_IP --format DropletID --no-header | xargs)
          if [ -n "$ASSIGNMENT" ] && [ "$ASSIGNMENT" != "null" ]; then
            doctl compute floating-ip-action unassign $RESERVED_IP || true
            sleep 15
          fi
        fi
        echo "RESERVED_IP=$RESERVED_IP" >> $GITHUB_ENV

    # Droplet Creation
    - name: Create Droplet
      id: create_droplet
      run: |
        MONITORING_FLAG=""
        if [[ "$ENABLE_MONITORING" == "true" ]]; then
          MONITORING_FLAG="--enable-monitoring"
        fi
        DROPLET_JSON=$(doctl compute droplet create $DROPLET_NAME \
          --region $REGION \
          --image $IMAGE \
          --size $SIZE \
          --ssh-keys $SSH_KEY_ID \
          $MONITORING_FLAG \
          --output json)
        DROPLET_ID=$(echo "$DROPLET_JSON" | jq -r '.[0].id')
        echo "DROPLET_ID=$DROPLET_ID" >> $GITHUB_ENV
        echo "droplet_id=$DROPLET_ID" >> $GITHUB_OUTPUT

        # Wait for active status
        while true; do
          STATUS=$(doctl compute droplet get $DROPLET_ID --format Status --no-header | xargs)
          [[ "$STATUS" == "active" ]] && break
          sleep 10
        done
        sleep 60

        # Assign IP
        doctl compute floating-ip-action assign $RESERVED_IP $DROPLET_ID
        sleep 30
        echo "DROPLET_IP=$RESERVED_IP" >> $GITHUB_ENV

    # SSH Setup and Verification
    - name: Set up SSH Agent
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Wait for SSH
      run: |
        echo "Waiting 180 seconds for SSH..."
        sleep 180

    - name: Verify SSH Connection
      continue-on-error: true
      run: |
        MAX_RETRIES=15
        for ((i=1; i<=MAX_RETRIES; i++)); do
          if ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 root@${{ env.RESERVED_IP }} "echo success"; then
            echo "SSH_SUCCESS=true" >> $GITHUB_ENV
            exit 0
          fi
          sleep 20
        done
        echo "SSH_SUCCESS=false" >> $GITHUB_ENV

    # Final Output
    - name: Deployment Summary
      run: |
        echo "Droplet IP: ${{ env.RESERVED_IP }}"
        echo "SSH Status: ${SSH_SUCCESS:-false}"
        if [[ "${SSH_SUCCESS:-false}" != "true" ]]; then
          echo "Manual connection: ssh root@${{ env.RESERVED_IP }}"
        fi
