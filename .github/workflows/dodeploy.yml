name: Deploy Application to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      droplet_ip:
        description: 'IP address of the DigitalOcean droplet'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${DROPLET_IP}:~/app

    - name: Deploy Docker Compose
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${DROPLET_IP} << 'EOF'
        cd ~/app
        export DROPLET_IP=${DROPLET_IP}
        
        # Verify DROPLET_IP is set
        echo "Checking DROPLET_IP environment variable..."
        echo "DROPLET_IP=${DROPLET_IP}"
        
        # Test if it's accessible in docker compose
        docker compose config | grep ALLOWED_HOSTS
        
        docker compose down
        docker compose build
        docker compose run --rm api python3 manage.py migrate
        docker compose up -d
        EOF
