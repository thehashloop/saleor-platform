name: Deploy Application to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      droplet_ip:
        description: 'IP address of the DigitalOcean droplet'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        # Remove any http:// prefix if present
        CLEAN_IP=$(echo ${DROPLET_IP} | sed 's|http://||')
        scp -o StrictHostKeyChecking=no -r . root@${CLEAN_IP}:~/app

    - name: Configure Firewall
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        CLEAN_IP=$(echo ${DROPLET_IP} | sed 's|http://||')
        ssh -o StrictHostKeyChecking=no root@${CLEAN_IP} << 'EOF'
        ufw allow 8000/tcp
        ufw allow 9000/tcp
        ufw allow 5432/tcp
        ufw allow 6379/tcp
        ufw allow 16686/tcp
        ufw allow 1025/tcp
        ufw allow 8025/tcp
        ufw allow ssh
        echo "y" | ufw enable
        EOF

    - name: Deploy Docker Compose
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        CLEAN_IP=$(echo ${DROPLET_IP} | sed 's|http://||')
        ssh -o StrictHostKeyChecking=no root@${CLEAN_IP} << EOF
        cd ~/app
        
        # Create .env file with DROPLET_IP
        echo "DROPLET_IP=${DROPLET_IP}" > .env
        
        # Explicitly set the IP in backend.env and docker-compose.yml
        sed -i "s/ALLOWED_HOSTS=.*/ALLOWED_HOSTS=localhost,api,${DROPLET_IP}/" backend.env
        sed -i "s/- ALLOWED_HOSTS=.*/- ALLOWED_HOSTS=localhost,api,${DROPLET_IP}/" docker-compose.yml
        sed -i "s#DASHBOARD_URL=http://localhost:9000/#DASHBOARD_URL=http://${DROPLET_IP}:9000/#" docker-compose.yml
        
        # Verify the changes
        echo "backend.env ALLOWED_HOSTS:"
        grep ALLOWED_HOSTS backend.env
        echo "docker-compose.yml ALLOWED_HOSTS:"
        grep ALLOWED_HOSTS docker-compose.yml
        
        # Stop and remove any existing containers
        docker compose down -v
        
        # Pull latest images
        docker compose pull
        
        # Create database and run migrations
        docker compose run --rm api python3 manage.py migrate
        
        # Populate database with sample data
        docker compose run --rm api python3 manage.py populatedb --createsuperuser
        
        # Start services in detached mode
        docker compose up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to start..."
        sleep 30
        
        # Check container status and logs
        docker compose ps
        docker compose logs api --tail 50
        
        # Disable IP filtering
        sed -i 's/HTTP_IP_FILTER_ENABLED=True/HTTP_IP_FILTER_ENABLED=False/' common.env
        
        # Add additional ports to firewall configuration
        EOF

    - name: Verify Deployment
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        echo "Waiting for services to fully initialize..."
        sleep 60
        
        # Test multiple endpoints
        for endpoint in "" "graphql/" "dashboard/"; do
          echo "Testing http://${DROPLET_IP}:8000/${endpoint}"
          curl -v http://${DROPLET_IP}:8000/${endpoint}
          echo -e "\n---\n"
        done
