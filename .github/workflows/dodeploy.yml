name: Deploy Application to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      droplet_ip:
        description: 'IP address of the DigitalOcean droplet'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Copy Files to Droplet
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        scp -o StrictHostKeyChecking=no -r . root@${DROPLET_IP}:~/app

    - name: Configure Firewall
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${DROPLET_IP} << 'EOF'
        ufw allow 8000/tcp
        ufw allow 9000/tcp
        ufw allow ssh
        echo "y" | ufw enable
        EOF

    - name: Deploy Docker Compose
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        ssh -o StrictHostKeyChecking=no root@${DROPLET_IP} << EOF
        cd ~/app
        
        # Create .env file with DROPLET_IP
        echo "DROPLET_IP=${DROPLET_IP}" > .env
        
        # Verify environment variable
        echo "DROPLET_IP is set to: ${DROPLET_IP}"
        
        # Stop and remove any existing containers
        docker compose down -v
        
        # Pull latest images
        docker compose pull
        
        # Create database and run migrations
        docker compose run --rm api python3 manage.py migrate
        
        # Populate database with sample data
        docker compose run --rm api python3 manage.py populatedb --createsuperuser
        
        # Start services in detached mode
        docker compose up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to start..."
        sleep 30
        
        # Check container status
        echo "Container status:"
        docker compose ps
        
        # Check logs for each service
        echo "API Logs:"
        docker compose logs api --tail 50
        
        echo "Database Logs:"
        docker compose logs db --tail 20
        
        echo "Redis Logs:"
        docker compose logs redis --tail 20
        
        # Verify API is responding
        echo "Testing API connection..."
        curl -v http://localhost:8000/
        EOF

    - name: Verify Deployment
      env:
        DROPLET_IP: ${{ inputs.droplet_ip }}
      run: |
        echo "Waiting for services to fully initialize..."
        sleep 60
        
        # Test multiple endpoints
        for endpoint in "" "graphql/" "dashboard/"; do
          echo "Testing http://${DROPLET_IP}:8000/${endpoint}"
          curl -v http://${DROPLET_IP}:8000/${endpoint}
          echo -e "\n---\n"
        done
