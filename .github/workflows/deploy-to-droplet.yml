name: Deploy to DigitalOcean Droplet

on:
  workflow_call:
    inputs:
      droplet_ip:
        required: true
        type: string
      spaces_name:
        required: true
        type: string
      spaces_region:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      DO_SSH_PRIVATE_KEY:
        required: true
      DO_SPACES_KEY:
        required: true
      DO_SPACES_SECRET:
        required: true
      GHCR_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      DROPLET_IP: ${{ inputs.droplet_ip }}
      ENVIRONMENT: ${{ inputs.environment }}
      DO_SPACES_NAME: ${{ inputs.spaces_name }}
      DO_SPACES_REGION: ${{ inputs.spaces_region }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Debug Connection Info
      run: |
        echo "Debug: Connecting to droplet with IP: ${{ inputs.droplet_ip }}"
        echo "Debug: DROPLET_IP env variable is: $DROPLET_IP"

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Verify Host Connection
      run: |
        # Disable strict host key checking for this test
        if [ -z "$DROPLET_IP" ]; then
          echo "Error: DROPLET_IP is empty. Cannot proceed with deployment."
          exit 1
        fi
        
        # Test connection to the host
        echo "Testing connection to $DROPLET_IP..."
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@$DROPLET_IP 'echo Connection successful'

    - name: Copy Files to Droplet
      run: |
        echo "Copying files to droplet at IP: $DROPLET_IP"
        scp -o StrictHostKeyChecking=no -r . root@$DROPLET_IP:~/app

    - name: Configure Environment and Start Services
      run: |
        ssh -o StrictHostKeyChecking=no root@$DROPLET_IP << EOF
        cd ~/app
        
        # Create .env file for Docker Compose
        cat > .env << EOL
        DO_SPACES_KEY=${{ secrets.DO_SPACES_KEY }}
        DO_SPACES_SECRET=${{ secrets.DO_SPACES_SECRET }}
        DO_SPACES_NAME=${{ inputs.spaces_name }}
        DO_SPACES_REGION=${{ inputs.spaces_region }}
        ENVIRONMENT=${{ inputs.environment }}
        EOL
        
        # Make scripts executable and fetch environment files
        chmod +x fetch-env.sh
        
        # Login to GitHub Container Registry
        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Start services with environment variables
        docker compose --env-file .env up -d
        
        echo "Application started with ${{ inputs.environment }} environment"
        EOF 