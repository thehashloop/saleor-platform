name: Setup DigitalOcean Tools

on:
  workflow_call:
    inputs:
      spaces_name:
        required: true
        type: string
      spaces_region:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      DO_TOKEN:
        required: true
      DO_SPACES_KEY:
        required: true
      DO_SPACES_SECRET:
        required: true
    outputs:
      droplet_ip:
        description: "IP address of the provisioned droplet"
        value: ${{ jobs.setup-tools.outputs.droplet_ip }}

jobs:
  setup-tools:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ steps.create_droplet.outputs.droplet_ip }}
    
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
      DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
      DO_SPACES_NAME: ${{ inputs.spaces_name }}
      DO_SPACES_REGION: ${{ inputs.spaces_region }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Debug: Show current directory and permissions
        pwd
        ls -la
        
        # Make script executable
        chmod +x fetch-env.sh
        
        # Install s3cmd if needed
        if ! command -v s3cmd &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y s3cmd
        fi
        
        # Fetch and source deployment config
        sudo -E ./fetch-env.sh
        source deployment.env || echo "deployment.env not found or failed to source"
        
        # Debug: Check if RESERVED_IP is defined
        echo "Debug: RESERVED_IP value is: ${RESERVED_IP:-not defined}"
        
        # Check if droplet already exists
        echo "Checking for existing droplet..."
        EXISTING_DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | grep "my-droplet" | awk '{print $1}')
        
        if [ ! -z "$EXISTING_DROPLET_ID" ]; then
          echo "Found existing droplet with ID: $EXISTING_DROPLET_ID"
          DROPLET_ID=$EXISTING_DROPLET_ID
          
          # Get the droplet's Public IP
          DROPLET_PUBLIC_IP=$(doctl compute droplet get $DROPLET_ID --format PublicIPv4 --no-header)
          echo "Existing droplet public IP: $DROPLET_PUBLIC_IP"
          
          # Check if reserved IP is defined and should be used
          if [ ! -z "$RESERVED_IP" ]; then
            echo "Reserved IP is defined: $RESERVED_IP"
            # Check if IP is already assigned
            CURRENT_IP=$(doctl compute droplet get $EXISTING_DROPLET_ID --format PublicIPv4 --no-header)
            if [ "$CURRENT_IP" == "$RESERVED_IP" ]; then
              echo "Reserved IP is already assigned to the droplet"
            else
              echo "Assigning reserved IP to existing droplet..."
              doctl compute floating-ip-action assign $RESERVED_IP $DROPLET_ID
              DROPLET_PUBLIC_IP=$RESERVED_IP
            fi
          fi
        else
          # Verify SSH key
          echo "Checking SSH key..."
          SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
          echo "SSH key verification completed with ID: $SSH_KEY_ID"
          
          # Create new droplet
          echo "Creating new droplet..."
          DROPLET_ID=$(doctl compute droplet create my-droplet \
            --region blr1 \
            --image docker-20-04 \
            --size s-2vcpu-4gb \
            --ssh-keys ${SSH_KEY_ID} \
            --enable-monitoring \
            --format ID \
            --no-header)
            
          echo "Droplet ID: $DROPLET_ID"
          
          # Wait for droplet to be active
          echo "Waiting for droplet to become active..."
          while [[ $(doctl compute droplet get $DROPLET_ID --format Status --no-header) != "active" ]]; do
            echo "Still waiting..."
            sleep 10
          done
          
          # Get the droplet's Public IP
          DROPLET_PUBLIC_IP=$(doctl compute droplet get $DROPLET_ID --format PublicIPv4 --no-header)
          echo "New droplet public IP: $DROPLET_PUBLIC_IP"
          
          # Check if reserved IP is defined and should be used
          if [ ! -z "$RESERVED_IP" ]; then
            echo "Reserved IP is defined: $RESERVED_IP"
            echo "Assigning reserved IP to new droplet..."
            doctl compute floating-ip-action assign $RESERVED_IP $DROPLET_ID
            DROPLET_PUBLIC_IP=$RESERVED_IP
          fi
        fi
        
        # Ensure we have a valid IP to use
        if [ -z "$DROPLET_PUBLIC_IP" ]; then
          echo "Error: Could not determine droplet IP address"
          exit 1
        fi
        
        # Export the IP address for use in other steps
        echo "Final Droplet IP: $DROPLET_PUBLIC_IP"
        echo "DROPLET_IP=$DROPLET_PUBLIC_IP" >> $GITHUB_ENV
        echo "droplet_ip=$DROPLET_PUBLIC_IP" >> $GITHUB_OUTPUT
        
        echo "Droplet setup completed"

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize
        
    - name: Debug Outputs
      run: |
        echo "Debug: Final DROPLET_IP env variable is: $DROPLET_IP"
        echo "Debug: This value will be passed to other workflows: $(cat $GITHUB_OUTPUT | grep droplet_ip)" 