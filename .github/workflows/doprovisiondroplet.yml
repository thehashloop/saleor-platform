name: Provision DigitalOcean Droplet

on:
  workflow_dispatch: # Trigger manually or as needed

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl compute droplet create my-droplet \
          --region nyc3 \
          --image docker-20-04 \
          --size s-1vcpu-1gb \
          --ssh-keys ${{ secrets.DO_SSH_PUBLIC_KEY }} \
          --enable-monitoring \
          --output json > droplet.json

        DROPLET_IP=$(jq -r '.[0].networks.v4[] | select(.type == "public") | .ip_address' droplet.json)
        echo "::set-output name=droplet_ip::$DROPLET_IP"

      outputs:
        droplet_ip: ${{ steps.create_droplet.outputs.droplet_ip }}

    - name: Wait for Droplet to Become Active
      run: sleep 60

    - name: Install Docker and Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@${{ steps.create_droplet.outputs.droplet_ip }} << 'EOF'
        apt-get update
        apt-get install -y docker.io docker-compose
        usermod -aG docker $USER
        EOF

    - name: Output Droplet IP
      run: echo "Droplet IP is ${{ steps.create_droplet.outputs.droplet_ip }}"
