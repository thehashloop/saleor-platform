name: Provision DigitalOcean Droplet

on:
  workflow_dispatch: # Trigger manually or as needed

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
    - name: Install doctl
      run: |
        sudo snap install doctl --classic

    - name: Authenticate doctl
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        doctl auth init --access-token $DIGITALOCEAN_ACCESS_TOKEN

    - name: Create Droplet
      id: create_droplet
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
      run: |
        echo "Starting droplet creation..."
        
        # Verify SSH key and get its ID
        echo "Checking SSH key..."
        SSH_KEY_ID=$(doctl compute ssh-key list --format ID --no-header)
        echo "Found SSH key ID: ${SSH_KEY_ID}"
        
        # Create droplet and get its ID
        echo "Creating droplet..."
        DROPLET_ID=$(doctl compute droplet create my-droplet \
          --region blr1 \
          --image docker-20-04 \
          --size s-2vcpu-4gb \
          --ssh-keys ${SSH_KEY_ID} \
          --enable-monitoring \
          --output json | jq -r '.[0].id')
        
        echo "Droplet created with ID: ${DROPLET_ID}"
        
        # Wait for network information to become available
        echo "Waiting for network information..."
        for i in {1..30}; do
          echo "Attempt $i: Checking for IP address..."
          DROPLET_DATA=$(doctl compute droplet get $DROPLET_ID --output json)
          echo "Droplet data: $DROPLET_DATA"
          
          # Check if networks field exists and has v4 entries
          DROPLET_IP=$(echo "$DROPLET_DATA" | jq -r '.[0].networks.v4 // [] | map(select(.type == "public")) | .[0].ip_address // empty')
          
          if [ ! -z "$DROPLET_IP" ]; then
            echo "IP address found: ${DROPLET_IP}"
            echo "DROPLET_IP=${DROPLET_IP}" >> $GITHUB_ENV
            break
          fi
          
          if [ $i -eq 30 ]; then
            echo "Timeout waiting for IP address"
            exit 1
          fi
          
          echo "Sleeping for 10 seconds before next attempt..."
          sleep 10
        done

    - name: Wait for Droplet to Become Active
      run: |
        sleep 60 # Give the droplet time to initialize

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

    - name: Install Docker and Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
        # Check if Docker is installed and running
        if ! command -v docker &> /dev/null || ! systemctl is-active --quiet docker; then
          apt-get update
          apt-get install -y docker.io docker-compose
          systemctl start docker
          systemctl enable docker
        else
          echo "Docker is already installed and running"
        fi
        
        # Add user to docker group regardless
        usermod -aG docker $USER
        EOF

    - name: Output Droplet IP
      run: echo "Droplet IP is ${{ env.DROPLET_IP }}"
