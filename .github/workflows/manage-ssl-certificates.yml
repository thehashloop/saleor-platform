name: Manage SSL Certificates

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name for the certificate'
        required: true
      spaces_name:
        description: 'Name of the DigitalOcean Space'
        required: true
      spaces_region:
        description: 'Region of the DigitalOcean Space'
        required: true
        default: 'blr1'

jobs:
  manage-certificates:
    runs-on: ubuntu-latest
    steps:
    - name: Check Existing Certificates in Spaces
      run: |
        # Install s3cmd
        sudo apt-get update && sudo apt-get install -y s3cmd
        
        # Configure s3cmd for Spaces
        cat > ~/.s3cfg << EOL
        [default]
        access_key = ${{ secrets.DO_SPACES_KEY }}
        secret_key = ${{ secrets.DO_SPACES_SECRET }}
        host_base = ${{ inputs.spaces_region }}.digitaloceanspaces.com
        host_bucket = %(bucket)s.${{ inputs.spaces_region }}.digitaloceanspaces.com
        use_https = True
        EOL
        
        # Create bucket if it doesn't exist
        if ! s3cmd ls s3://${{ inputs.spaces_name }}; then
          echo "Creating bucket ${{ inputs.spaces_name }}"
          s3cmd mb s3://${{ inputs.spaces_name }}
        fi
        
        # Create temp directory for certificates
        mkdir -p .certificates
        
        # Try to download existing certificates
        if s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem .certificates/fullchain.pem 2>/dev/null; then
          s3cmd get s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem .certificates/privkey.pem
          
          # Check if certificates exist and are valid
          if [ -f .certificates/fullchain.pem ] && [ -f .certificates/privkey.pem ]; then
            if openssl x509 -checkend 2592000 -noout -in .certificates/fullchain.pem; then
              echo "Found valid certificates in Spaces"
              echo "Certificate details:"
              openssl x509 -text -noout -in .certificates/fullchain.pem | grep -A 2 "Validity"
            else
              echo "Certificates exist but are expired"
            fi
          fi
        else
          echo "No existing certificates found in Spaces"
        fi

    - name: Get New ZeroSSL Certificate
      if: success() || failure()
      run: |
        # Install certbot and plugin
        sudo apt-get update
        sudo apt-get install -y python3-pip
        sudo pip3 install certbot
        
        # Create required directories
        sudo mkdir -p /etc/letsencrypt/live/${{ inputs.domain }}
        
        # Try to get certificate from ZeroSSL
        sudo certbot certonly --standalone \
          --preferred-challenges http \
          -d ${{ inputs.domain }} \
          --non-interactive \
          --agree-tos \
          -m admin@ayurvahi.com \
          --server https://acme.zerossl.com/v2/DV90 \
          --eab-kid "${{ secrets.ZEROSSL_KID }}" \
          --eab-hmac-key "${{ secrets.ZEROSSL_HMAC_KEY }}" \
          --cert-name ${{ inputs.domain }}

    - name: Upload Certificates to Spaces
      if: success()
      run: |
        # Find the actual certificate files
        CERT_DIR=$(sudo find /etc/letsencrypt/live -type l -name fullchain.pem | head -n 1 | xargs dirname)
        
        if [ -n "$CERT_DIR" ]; then
          # Get the actual files from archive
          REAL_FULLCHAIN=$(sudo readlink -f "$CERT_DIR/fullchain.pem")
          REAL_PRIVKEY=$(sudo readlink -f "$CERT_DIR/privkey.pem")
          
          # Copy certificates to current user's access
          sudo cp "$REAL_FULLCHAIN" fullchain.pem
          sudo cp "$REAL_PRIVKEY" privkey.pem
          sudo chown $USER:$USER fullchain.pem privkey.pem
          
          # Upload to Spaces
          s3cmd put fullchain.pem \
            s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/fullchain.pem
          
          s3cmd put privkey.pem \
            s3://${{ inputs.spaces_name }}/certificates/${{ inputs.domain }}/privkey.pem
          
          echo "Certificates successfully uploaded to Spaces"
          
          # Clean up
          rm fullchain.pem privkey.pem
        else
          echo "Could not find certificate files"
          exit 1
        fi 