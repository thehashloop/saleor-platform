name: saleor-platform
services:
  - name: api
    dockerfile_path: Dockerfile  # Path to your API Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: thehashloop/saleor-platform
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs

  - name: worker
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      repo: thehashloop/saleor-platform
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    instance_count: 1
    instance_size_slug: basic-xxs

databases:
  - engine: PG
    name: saleor-db
    num_nodes: 1
    size: db-s-dev-database

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${saleor-db.DATABASE_URL}
  - key: SECRET_KEY
    scope: RUN_TIME
    value: "your-secret-key-here"
  - key: ALLOWED_HOSTS
    scope: RUN_TIME
    value: "${APP_DOMAIN}" 