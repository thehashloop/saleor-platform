name: saleor-platform
services:
  - name: api
    image:
      registry_type: DOCKER_HUB  # This works for GHCR as well
      repository: ghcr.io/saleor/saleor
      tag: 3.20
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs

  - name: worker
    image:
      registry_type: DOCKER_HUB
      repository: ghcr.io/saleor/saleor
      tag: 3.20
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    instance_count: 1
    instance_size_slug: basic-xxs

databases:
  - engine: PG
    name: saleor-db
    num_nodes: 1
    size: db-s-dev-database

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${saleor-db.DATABASE_URL}
  - key: SECRET_KEY
    scope: RUN_TIME
    value: "your-secret-key-here"
  - key: ALLOWED_HOSTS
    scope: RUN_TIME
    value: "${APP_DOMAIN}" 